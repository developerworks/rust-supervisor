# Disallow blocking I/O, synchronous locks, and raw OS process spawns in
# asynchronous contexts. Subtask code must use tokio::fs, tokio::net,
# tokio::sync::Mutex, tokio::time::sleep, and tokio::process::Command instead.
disallowed-methods = [
    "std::fs::read",
    "std::fs::write",
    { path = "std::fs::File", allow-invalid = true },
    { path = "std::net::TcpStream", allow-invalid = true },
    "std::thread::sleep",
    { path = "std::sync::Mutex", allow-invalid = true },
    { path = "std::process::Command", allow-invalid = true },
]
