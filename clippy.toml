# This lint is global and cannot detect whether a call is inside an async
# runtime context. Keep only APIs that should be banned everywhere. Blocking
# filesystem calls are intentionally not listed because sync CLI and test code
# use them outside async runtime contexts.
disallowed-methods = [
    { path = "std::net::TcpStream", allow-invalid = true },
    "std::thread::sleep",
    { path = "std::sync::Mutex", allow-invalid = true },
    { path = "std::process::Command", allow-invalid = true },
]
